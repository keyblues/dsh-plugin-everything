# Publish dsh-plugin-everything to the npm registry and attach the packed
# tarball to its GitHub release.
#
# Authentication — configure ONE of:
#   1. Trusted publishing (recommended, no long-lived token):
#      npmjs.com → the package → Settings → Trusted Publisher → GitHub Actions,
#      owner = keyblues, repository = dsh-plugin-everything,
#      workflow filename = publish.yml. Requires npm CLI >= 11.5.1 and
#      Node >= 22.14 (this workflow uses Node 24); the npm CLI picks up the
#      OIDC token automatically when no token is supplied.
#   2. Repository secret NPM_TOKEN: a granular npm access token with publish
#      rights. It is passed as NODE_AUTH_TOKEN; npm falls back to it when no
#      trusted publisher is configured.
#
# Triggers:
#   * pushing a version tag (v*) publishes that version and updates the release
#   * manual "Run workflow" publishes the version currently in package.json
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js (npm CLI with trusted-publishing support)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pack the DSH bundle
        run: npm pack

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create or update the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" ./*.tgz --clobber
